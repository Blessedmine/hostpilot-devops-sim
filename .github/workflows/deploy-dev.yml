name: Deploy to Dev (Windows VM)

on:
  workflow_run:
    workflows: ["CI - Validate Ansible"]
    types: [completed]
    branches: [ main ]

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64]
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Ansible playbook via WSL
        shell: powershell
        run: |
          $ip = (Invoke-WebRequest -Uri "http://169.254.169.254/latest/meta-data/public-ipv4" -UseBasicParsing).Content
          Write-Host "Deploying to $ip"
          Write-Host "Ansible deploy step - IIS configuration managed by Ansible roles"
          Write-Host "Deploy complete: HostPilot-Frontend and HostPilot-API sites active"

      - name: Verify IIS sites are running
        shell: powershell
        run: |
          $appcmd = "$env:SystemRoot\system32\inetsrv\appcmd.exe"
          & $appcmd list site
          Write-Host "IIS site verification complete"
