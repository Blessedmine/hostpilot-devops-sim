name: Deploy to Dev (Windows VM)

on:
  workflow_run:
    workflows: ["CI - Validate Ansible"]
    types: [completed]
    branches: [ main ]

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64]
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify IIS sites are running
        shell: powershell
        run: |
          $appcmd = "$env:SystemRoot\system32\inetsrv\appcmd.exe"
          & $appcmd list site
          Write-Host "Deploy complete: HostPilot sites verified on self-hosted Windows runner"

      - name: Confirm deployment
        shell: powershell
        run: |
          Write-Host "Deployment successful - HostPilot-Frontend (port 80) and HostPilot-API (port 8080) are active"
          Write-Host "Deployed via: GitHub Actions -> self-hosted Windows runner -> IIS"
