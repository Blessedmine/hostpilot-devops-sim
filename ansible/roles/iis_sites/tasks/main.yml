---
- name: Create frontend site directory
  ansible.windows.win_file:
    path: C:\inetpub\hostpilot-frontend
    state: directory

- name: Create API site directory
  ansible.windows.win_file:
    path: C:\inetpub\hostpilot-api
    state: directory

- name: Deploy frontend index.html
  ansible.windows.win_copy:
    content: |
      <!DOCTYPE html>
      <html>
      <head><title>HostPilot Control Panel</title></head>
      <body>
        <h1>HostPilot Control Panel</h1>
        <p>Status: <strong>Online</strong></p>
        <p>Deployed by: <strong>Ansible</strong></p>
      </body>
      </html>
    dest: C:\inetpub\hostpilot-frontend\index.html

- name: Deploy API health check
  ansible.windows.win_copy:
    content: '{"status":"healthy","service":"HostPilot-API","deployed_by":"ansible"}'
    dest: C:\inetpub\hostpilot-api\health.json

- name: Stop Default Web Site
  ansible.windows.win_shell: |
    $appcmd = "$env:SystemRoot\system32\inetsrv\appcmd.exe"
    & $appcmd stop site /site.name:"Default Web Site"
  changed_when: false
  ignore_errors: yes

- name: Create HostPilot-Frontend site
  ansible.windows.win_shell: |
    $appcmd = "$env:SystemRoot\system32\inetsrv\appcmd.exe"
    $site = & $appcmd list site "HostPilot-Frontend"
    if (-not $site) {
      & $appcmd add site /name:"HostPilot-Frontend" /physicalPath:"C:\inetpub\hostpilot-frontend" /bindings:"http/*:80:"
      & $appcmd set app "HostPilot-Frontend/" /applicationPool:"HostPilot-Frontend"
    }
    & $appcmd start site /site.name:"HostPilot-Frontend"
  changed_when: false

- name: Create HostPilot-API site
  ansible.windows.win_shell: |
    $appcmd = "$env:SystemRoot\system32\inetsrv\appcmd.exe"
    $site = & $appcmd list site "HostPilot-API"
    if (-not $site) {
      & $appcmd add site /name:"HostPilot-API" /physicalPath:"C:\inetpub\hostpilot-api" /bindings:"http/*:8080:"
      & $appcmd set app "HostPilot-API/" /applicationPool:"HostPilot-API"
    }
    & $appcmd start site /site.name:"HostPilot-API"
  changed_when: false
